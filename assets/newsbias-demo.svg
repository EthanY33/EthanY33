<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="news-bias-analyzer demo: comparing 5 sources on the same topic, scoring sentiment and framing divergence">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .chrome { fill: #161b22; }
      .dot-r { fill: #f85149; }
      .dot-y { fill: #f1c40f; }
      .dot-g { fill: #22c55e; }
      .title { font: 11px ui-sans-serif, system-ui, "Inter", sans-serif; fill: #6b7280; }
      .term { font: 11.5px ui-monospace, "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, monospace; }
      .text { fill: #e5e7eb; }
      .dim  { fill: #9ca3af; }
      .ok   { fill: #22c55e; }
      .pos  { fill: #fbbf24; }
      .neg  { fill: #5ad7ff; }
      .accent { fill: #a5b4fc; }
      .warn { fill: #f87171; }
    </style>
  </defs>
  <rect class="bg" width="600" height="280" rx="8"/>
  <rect class="chrome" width="600" height="28" rx="8"/>
  <rect class="chrome" y="20" width="600" height="10"/>
  <circle class="dot-r" cx="14" cy="14" r="5"/>
  <circle class="dot-y" cx="32" cy="14" r="5"/>
  <circle class="dot-g" cx="50" cy="14" r="5"/>
  <text class="title" x="300" y="18" text-anchor="middle">news-bias-analyzer</text>

  <g class="term" transform="translate(16,52)">
    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.04;0.05;1" values="0;0;1;1"/>
      <text>
        <tspan class="dim">$ </tspan><tspan class="text">npx news-bias-analyzer </tspan><tspan class="accent">--topic</tspan><tspan class="text"> "fed rate decision" </tspan><tspan class="accent">--sources</tspan><tspan class="text"> 5</tspan>
      </text>
    </g>

    <g opacity="0" transform="translate(0,28)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.12;0.13;1" values="0;0;1;1"/>
      <text class="text"><tspan class="accent">▸</tspan> collecting 5 sources<tspan class="dim">...</tspan></text>
    </g>

    <g opacity="0" transform="translate(0,52)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.20;0.21;1" values="0;0;1;1"/>
      <text>
        <tspan class="ok">  ✓</tspan><tspan class="text"> reuters.com        </tspan><tspan class="dim">neutral   </tspan><tspan class="text"> framing: </tspan><tspan class="dim">economic</tspan>
      </text>
    </g>
    <g opacity="0" transform="translate(0,72)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.28;0.29;1" values="0;0;1;1"/>
      <text>
        <tspan class="ok">  ✓</tspan><tspan class="text"> wsj.com            </tspan><tspan class="pos">+0.42     </tspan><tspan class="text"> framing: </tspan><tspan class="dim">market</tspan>
      </text>
    </g>
    <g opacity="0" transform="translate(0,92)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.36;0.37;1" values="0;0;1;1"/>
      <text>
        <tspan class="ok">  ✓</tspan><tspan class="text"> nytimes.com        </tspan><tspan class="neg">-0.18     </tspan><tspan class="text"> framing: </tspan><tspan class="dim">policy</tspan>
      </text>
    </g>
    <g opacity="0" transform="translate(0,112)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.44;0.45;1" values="0;0;1;1"/>
      <text>
        <tspan class="ok">  ✓</tspan><tspan class="text"> foxbusiness.com    </tspan><tspan class="pos">+0.61     </tspan><tspan class="text"> framing: </tspan><tspan class="dim">political</tspan>
      </text>
    </g>
    <g opacity="0" transform="translate(0,132)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.52;0.53;1" values="0;0;1;1"/>
      <text>
        <tspan class="ok">  ✓</tspan><tspan class="text"> guardian.com       </tspan><tspan class="neg">-0.34     </tspan><tspan class="text"> framing: </tspan><tspan class="dim">social</tspan>
      </text>
    </g>

    <g opacity="0" transform="translate(0,162)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.65;0.66;1" values="0;0;1;1"/>
      <text>
        <tspan class="dim">  framing divergence: </tspan><tspan class="warn">0.81 </tspan><tspan class="dim"> (high)</tspan>
      </text>
    </g>
    <g opacity="0" transform="translate(0,182)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.72;0.73;1" values="0;0;1;1"/>
      <text>
        <tspan class="dim">  consensus on facts:  </tspan><tspan class="ok">0.94 </tspan><tspan class="dim"> (very high)</tspan>
      </text>
    </g>

    <g opacity="0" transform="translate(0,212)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.85;0.86;1" values="0;0;1;1"/>
      <text class="text">  → all 5 agree on what happened.</text>
    </g>
    <g opacity="0" transform="translate(0,228)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.90;0.91;1" values="0;0;1;1"/>
      <text class="dim">    they disagree on what it means.</text>
    </g>
  </g>
</svg>
