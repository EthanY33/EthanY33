<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="atelier terminal demo: invoking the brand-asset skill, generating a TideWane capsule from the shared source of truth">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .chrome { fill: #161b22; }
      .dot-r { fill: #f85149; }
      .dot-y { fill: #f1c40f; }
      .dot-g { fill: #22c55e; }
      .title { font: 11px ui-sans-serif, system-ui, "Inter", sans-serif; fill: #6b7280; }
      .term { font: 12px ui-monospace, "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, monospace; }
      .prompt-user { fill: #5ad7ff; }
      .prompt-host { fill: #a5b4fc; }
      .prompt-cwd  { fill: #fbbf24; }
      .text { fill: #e5e7eb; }
      .dim  { fill: #9ca3af; }
      .ok   { fill: #22c55e; }
      .accent { fill: #5ad7ff; }
      .cmd  { fill: #e5e7eb; }
      .cur  { fill: #5ad7ff; }
    </style>
  </defs>
  <rect class="bg" width="600" height="280" rx="8"/>
  <rect class="chrome" width="600" height="28" rx="8"/>
  <rect class="chrome" y="20" width="600" height="10"/>
  <circle class="dot-r" cx="14" cy="14" r="5"/>
  <circle class="dot-y" cx="32" cy="14" r="5"/>
  <circle class="dot-g" cx="50" cy="14" r="5"/>
  <text class="title" x="300" y="18" text-anchor="middle">~/goneidle/site — atelier</text>

  <g class="term" transform="translate(16,52)">
    <!-- Line 1: prompt + invocation (visible from 0.4s) -->
    <g opacity="0">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.04;0.05;1" values="0;0;1;1"/>
      <text>
        <tspan class="prompt-user">ethan</tspan><tspan class="dim">@</tspan><tspan class="prompt-host">goneidle</tspan><tspan class="dim"> </tspan><tspan class="prompt-cwd">site</tspan><tspan class="dim"> $ </tspan><tspan class="cmd">claude</tspan>
      </text>
    </g>

    <!-- Line 2: slash command -->
    <g opacity="0" transform="translate(0,22)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.10;0.11;1" values="0;0;1;1"/>
      <text>
        <tspan class="dim">&gt; </tspan><tspan class="accent">/atelier:capsule</tspan><tspan class="text"> "TideWane v1.2.2 — calm aboveline, combat below"</tspan>
      </text>
    </g>

    <!-- Line 3-5: skill loads -->
    <g opacity="0" transform="translate(0,58)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.22;0.23;1" values="0;0;1;1"/>
      <text class="text"><tspan class="accent">▸</tspan> atelier:brand-asset</text>
    </g>
    <g opacity="0" transform="translate(0,80)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.30;0.31;1" values="0;0;1;1"/>
      <text class="dim">  loaded source-of-truth: <tspan class="text">brand.json</tspan></text>
    </g>
    <g opacity="0" transform="translate(0,102)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.40;0.41;1" values="0;0;1;1"/>
      <text class="dim">  composed in <tspan class="text">1.4s</tspan></text>
    </g>

    <!-- Line 6-8: outputs -->
    <g opacity="0" transform="translate(0,138)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.55;0.56;1" values="0;0;1;1"/>
      <text>
        <tspan class="ok">✓</tspan><tspan class="text"> brand/capsules/2026-04-29-tidewane-v1.2.2.png  </tspan><tspan class="dim">1920×620</tspan>
      </text>
    </g>
    <g opacity="0" transform="translate(0,160)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.65;0.66;1" values="0;0;1;1"/>
      <text>
        <tspan class="ok">✓</tspan><tspan class="text"> brand/capsules/2026-04-29-tidewane-v1.2.2.webp </tspan><tspan class="dim">1920×620</tspan>
      </text>
    </g>
    <g opacity="0" transform="translate(0,182)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.75;0.76;1" values="0;0;1;1"/>
      <text>
        <tspan class="ok">✓</tspan><tspan class="text"> updated </tspan><tspan class="accent">brand/manifest.json</tspan>
      </text>
    </g>

    <!-- Cursor line -->
    <g opacity="0" transform="translate(0,212)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.85;0.86;1" values="0;0;1;1"/>
      <text>
        <tspan class="prompt-user">ethan</tspan><tspan class="dim">@</tspan><tspan class="prompt-host">goneidle</tspan><tspan class="dim"> </tspan><tspan class="prompt-cwd">site</tspan><tspan class="dim"> $ </tspan>
      </text>
      <rect class="cur" x="125" y="-12" width="8" height="16">
        <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;0;1"/>
      </rect>
    </g>
  </g>
</svg>
