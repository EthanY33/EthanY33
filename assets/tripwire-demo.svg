<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="trailer-tripwire demo: pre-ship video audit catching AI-default tells before reviewers see them">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .chrome { fill: #161b22; }
      .dot-r { fill: #f85149; }
      .dot-y { fill: #f1c40f; }
      .dot-g { fill: #22c55e; }
      .title { font: 11px ui-sans-serif, system-ui, "Inter", sans-serif; fill: #6b7280; }
      .term { font: 11.5px ui-monospace, "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, monospace; }
      .text { fill: #e5e7eb; }
      .dim  { fill: #9ca3af; }
      .ok   { fill: #22c55e; }
      .err  { fill: #f87171; }
      .accent { fill: #5ad7ff; }
      .strip { fill: #1f2937; }
      .frame-ok { fill: #22c55e; opacity: 0.4; }
      .frame-bad { fill: #f87171; opacity: 0.8; }
      .scan-line { stroke: #5ad7ff; stroke-width: 2; opacity: 0.9; }
    </style>
  </defs>
  <rect class="bg" width="600" height="280" rx="8"/>
  <rect class="chrome" width="600" height="28" rx="8"/>
  <rect class="chrome" y="20" width="600" height="10"/>
  <circle class="dot-r" cx="14" cy="14" r="5"/>
  <circle class="dot-y" cx="32" cy="14" r="5"/>
  <circle class="dot-g" cx="50" cy="14" r="5"/>
  <text class="title" x="300" y="18" text-anchor="middle">trailer-tripwire</text>

  <!-- Filmstrip scan visualization -->
  <g transform="translate(16,44)">
    <rect class="strip" x="0" y="0" width="568" height="34" rx="3"/>
    <!-- 24 frame cells -->
    <g>
      <rect class="frame-ok" x="6" y="4"  width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="30" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="54" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="78" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-bad" x="102" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-bad" x="126" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-bad" x="150" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="174" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="198" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="222" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="246" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="270" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="294" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="318" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="342" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="366" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="390" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="414" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="438" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="462" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="486" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="510" y="4" width="20" height="26" rx="1"/>
      <rect class="frame-ok" x="534" y="4" width="20" height="26" rx="1"/>
    </g>
    <!-- Scan line sweep -->
    <line class="scan-line" x1="10" y1="2" x2="10" y2="32">
      <animate attributeName="x1" dur="3.6s" repeatCount="indefinite" values="6;556;6"/>
      <animate attributeName="x2" dur="3.6s" repeatCount="indefinite" values="6;556;6"/>
    </line>
  </g>

  <g class="term" transform="translate(16,98)">
    <g opacity="0">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.04;0.05;1" values="0;0;1;1"/>
      <text>
        <tspan class="dim">$ </tspan><tspan class="text">npm run content:audit -- </tspan><tspan class="accent">studio.mp4</tspan>
      </text>
    </g>

    <g opacity="0" transform="translate(0,28)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.14;0.15;1" values="0;0;1;1"/>
      <text class="text"><tspan class="accent">▸</tspan> scanning 25.6s @ 60fps<tspan class="dim"> (1536 frames)</tspan></text>
    </g>

    <g opacity="0" transform="translate(0,52)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.30;0.31;1" values="0;0;1;1"/>
      <text>
        <tspan class="ok">  ✓</tspan><tspan class="text"> audio bed: RMS stdev </tspan><tspan class="dim">4.8 (passes 3.0 floor)</tspan>
      </text>
    </g>
    <g opacity="0" transform="translate(0,72)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.38;0.39;1" values="0;0;1;1"/>
      <text>
        <tspan class="ok">  ✓</tspan><tspan class="text"> cut pacing: 7 cuts, longest dwell </tspan><tspan class="dim">3.2s</tspan>
      </text>
    </g>

    <g opacity="0" transform="translate(0,102)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.55;0.56;1" values="0;0;1;1"/>
      <text>
        <tspan class="err">  ✗</tspan><tspan class="text"> 0:14–0:17  </tspan><tspan class="dim">VHS static overlay </tspan><tspan class="err">— banned aesthetic</tspan>
      </text>
    </g>
    <g opacity="0" transform="translate(0,122)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.65;0.66;1" values="0;0;1;1"/>
      <text>
        <tspan class="err">  ✗</tspan><tspan class="text"> caption L18  </tspan><tspan class="dim">"passionate developer" </tspan><tspan class="err">— AI-default copy</tspan>
      </text>
    </g>

    <g opacity="0" transform="translate(0,152)">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.82;0.83;1" values="0;0;1;1"/>
      <text>
        <tspan class="err">2 issues found.</tspan><tspan class="text"> Fix before shipping.</tspan>
      </text>
    </g>
  </g>
</svg>
